der-bottom:1px solid #eee}.person:last-child{border:0}.init{width:37px;height:37px;border-radius:11px;background:#fff0f0;color:var(--r);display:grid;place-items:center;font-size:11px;font-weight:950}.pMain{flex:1;min-width:0}.pMain b{font-size:12px}.pMain div{font-size:10px;color:#777;margin-top:2px}.nav{position:absolute;z-index:35;left:0;right:0;bottom:0;height:68px;border-top:1px solid var(--l);background:#fff;display:grid;padding:5px}.nav button{border:0;background:transparent;color:#777;font-size:9px}.nav button.active{color:var(--r);font-weight:950}.nav b{display:block;font-size:18px;margin-bottom:3px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice button{min-height:54px;border-radius:12px;font-weight:950}.yes{border:1px solid #bee4ce;background:#eefaf2;color:#13723f}.no{border:1px solid #efc3c3;background:#fff0f0;color:var(--r2)}.photo{min-height:92px;border:2px dashed #ccc;border-radius:13px;background:#fafafa;display:grid;place-items:center;text-align:center;padding:10px;color:#666;font-size:11px}.tabs{display:flex;gap:5px;overflow:auto;background:#e8e8e8;border-radius:12px;padding:4px}.tabs button{flex:0 0 auto;border:0;border-radius:9px;background:transparent;padding:10px 9px;font-size:9px;font-weight:900;color:#666}.tabs button.active{background:#fff;color:var(--r)}.tableWrap{overflow:auto;border:1px solid var(--l);background:#fff;border-radius:14px}.table{border-collapse:collapse;min-width:570px;width:100%;font-size:9px}.table th,.table td{padding:8px 6px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.table th{background:#fafafa;color:#666}.divider{border-top:1px solid #eee;margin:12px 0}.toast{display:none;position:absolute;z-index:100;top:43px;left:15px;right:15px;background:#1f1f1f;color:#fff;border-radius:12px;padding:11px;text-align:center;font-size:11px;font-weight:900}.toast.on{display:block}.sheetBg{display:none;position:absolute;z-index:80;inset:0;background:#0006;align-items:flex-end}.sheetBg.on{display:flex}.sheet{width:100%;max-height:80%;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.close{width:40px;height:40px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:18px}@media(max-width:820px){body{padding:0;background:#fff}.side{display:none}.shell{display:block}.phone{width:100%;height:100vh;border:0;border-radius:0;box-shadow:none}.notch{display:none}}

<body>
<div class="shell"><aside class="side"><span class="pill">DEMO OFFLINE v3.3 · 4 ROLES</span><h1>PROSPECTA │ RTM</h1><p>Incluye Prospector, <b>Desarrollador</b>, Supervisor y Administrador. El demo simula la navegación sin conectarse a Supabase.</p><div class="roleBtns"><button data-side="prospector">Prospector · Fiorella</button><button data-side="developer">Desarrollador · Diego</button><button data-side="supervisor">Supervisor · Claudia</button><button data-side="admin">Administrador · Pilar</button></div><p style="margin-top:18px;font-size:11px">Producción: Supabase Auth + PostgreSQL + Storage privado, publicado en Netlify.</p></aside>
<div class="phone"><div class="notch"></div><div id="toast" class="toast"></div><div id="sheetBg" class="sheetBg"><div id="sheet" class="sheet"></div></div>
<section id="login" class="login"><img src="public/logo-prospecta-rtm-oficial.png" class="logo"><div class="loginCard"><h2>Bienvenido</h2><div class="muted" style="margin-top:5px">Acceso rápido para la presentación.</div><label class="label">Usuario</label><input class="field" value="usuario.demo" readonly><label class="label">Contraseña</label><input type="password" class="field" value="123456" readonly><div class="quick"><button data-role="prospector">👤 Prospector · Fiorella Natali</button><button data-role="developer">💼 Desarrollador · Diego Vega</button><button data-role="supervisor">📊 Supervisor · Claudia</button><button data-role="admin">⚙ Administrador · Pilar</button></div></div></section>
<section id="main" class="view" style="display:none"><header class="top"><div class="toprow"><img src="public/logo-prospecta-rtm-oficial.png" class="miniLogo"><button id="profile" class="avatar">PE</button></div><div id="roleLine" class="roleLine"></div></header><main id="content" class="content"></main></section><nav id="nav" class="nav" style="display:none"></nav></div></div></div>
<script>
(()=>{
const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>[...c.querySelectorAll(s)];
const login=$('#login'),main=$('#main'),content=$('#content'),nav=$('#nav'),roleLine=$('#roleLine'),profile=$('#profile'),toast=$('#toast'),sheetBg=$('#sheetBg'),sheet=$('#sheet');
const profiles={prospector:{name:'Fiorella Natali',role:'Prospector',initials:'FR',region:'Sur'},developer:{name:'Diego Vega',role:'Desarrollador',initials:'DV',region:'Lima'},supervisor:{name:'Claudia',role:'Supervisor',initials:'CA',region:'Lima'},admin:{name:'Pilar',role:'Administradora',initials:'PE',region:'Lima'}};
const navs={prospector:[['ph','⌂','Inicio'],['pv','⌖','Visitas'],['pa','▥','Avance'],['pf','⇥','Fin']],developer:[['dh','⌂','Inicio'],['dj','◷','Jornada'],['dv','⌖','Visitas'],['da','▥','Avance'],['df','⇥','Fin']],supervisor:[['sd','▥','Dashboard'],['se','♙','Equipo'],['sa','◷','Asistencia'],['sv','⌖','Visitas']],admin:[['ad','▥','Dashboard'],['au','♙','Usuarios'],['ab','▤','Bases'],['ac','⚙','Config.']]};
let s={role:null,page:null,pJ:false,dJ:false,dEnd:false,dVisit:false,bonus:'',db:'inicio'};
const db={
inicio:[['14/09','Fiorella','07:56','Anticipado']],
visitas:[['14/09','Fiorella','09:22','SI','Bodega']],
fin:[['14/09','Fiorella','17:26','9']],
devInicio:[['14/09','Diego','07:58','Anticipado']],
devVisitas:[
 ['14/09','Diego','10024578','SI','Dinero efectivo','foto.jpg','',''],
 ['14/09','Diego','10027891','SI','Nota de crédito','','NC-001245',''],
 ['14/09','Diego','10029901','NO','','','','Cliente no disponible para recibir bono']
],
devFin:[['14/09','Diego','07:58','17:12','554 min']]
}
function show(msg){toast.textContent=msg;toast.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('on'),1600)}
function openSheet(h){sheet.innerHTML=h;sheetBg.classList.add('on')} function closeSheet(){sheetBg.classList.remove('on');sheet.innerHTML=''} sheetBg.onclick=e=>{if(e.target===sheetBg)closeSheet()};
function enter(role){s.role=role;s.page=role==='prospector'?'ph':role==='developer'?'dh':role==='supervisor'?'sd':'ad';login.style.display='none';main.style.display='block';nav.style.display='grid';const p=profiles[role];roleLine.textContent=`${p.name} · ${p.role} · ${p.region}`;profile.textContent=p.initials;render()}
$$('[data-role]').forEach(b=>b.onclick=()=>enter(b.dataset.role));$$('[data-side]').forEach(b=>b.onclick=()=>enter(b.dataset.side));
profile.onclick=()=>{const p=profiles[s.role];openSheet(`<div class="row"><div><b>${p.name}</b><div class="muted">${p.role} · ${p.region}</div></div><button class="close" id="x">×</button></div><button class="btn secondary" id="switch" style="margin-top:16px">Cambiar rol</button>`);$('#x').onclick=closeSheet;$('#switch').onclick=()=>{closeSheet();main.style.display='none';nav.style.display='none';login.style.display='block'}};
function K(v,l){return `<div class="kpi"><b>${v}</b><span>${l}</span></div>`} function P(i,n,sub,r=''){return `<div class="person"><div class="init">${i}</div><div class="pMain"><b>${n}</b><div>${sub}</div></div><b style="font-size:10px">${r}</b></div>`}
function renderNav(){const n=navs[s.role];nav.style.gridTemplateColumns=`repeat(${n.length},1fr)`;nav.innerHTML=n.map(x=>`<button class="${s.page===x[0]?'active':''}" data-nav="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');$$('[data-nav]',nav).forEach(b=>b.onclick=()=>{s.page=b.dataset.nav;render()})}
function render(){renderNav();if(s.role==='prospector')rPros();else if(s.role==='developer')rDev();else if(s.role==='supervisor')rSup();else rAdmin();main.scrollTop=0;bind()}
function rPros(){if(s.page==='ph')content.innerHTML=`<div class="card hero"><div class="row"><div><div class="muted">Hola,</div><b style="font-size:20px">Fiorella 👋</b></div><span class="status ${s.pJ?'':'warn'}">${s.pJ?'JORNADA ACTIVA':'PENDIENTE'}</span></div></div><div class="grid2"><button class="menu" data-go="pj"><span>◷</span><strong>Inicio de Jornada</strong><small>Registra tu ingreso.</small></button><button class="menu" data-go="pv"><span>⌖</span><strong>Registro de Visitas</strong><small>GPS y alta de cliente.</small></button></div><div class="section">Resumen</div><div class="grid2">${K('07','Visitas')}${K('03','Altas')}</div>`;else if(s.page==='pv'){content.innerHTML=!s.pJ?`<div class="alert warnbox"><b>Hola prospector ☺</b><br>Antes de iniciar tus visitas, registra tu inicio de jornada.</div><button id="goPJ" class="btn primary" style="margin-top:12px">Ir a Inicio de Jornada</button>`:`<div class="card"><b>Nueva visita</b><div class="muted">GPS obligatorio · flujo Prospector vigente</div><button class="btn primary" style="margin-top:13px" onclick="document.getElementById('toast').classList.add('on')">Iniciar Visita</button></div><div class="card">${P('✓','Bodega San Martín','10:14 · Exitosa','Alta')}${P('×','Licorería Central','09:31 · No exitosa','NO')}</div>`}else if(s.page==='pj'){content.innerHTML=s.pJ?`<div class="alert ok"><b>Jornada registrada</b><br>Ingreso Anticipado · 07:56</div>`:`<div class="card"><b>Inicio de Jornada</b><div class="muted" style="margin-top:5px">Sur · horario base 08:00</div><button id="pStart" class="btn primary" style="margin-top:14px">Registrar Inicio</button></div>`}else if(s.page==='pa')content.innerHTML=`<div class="grid2">${K('07','Visitas')}${K('03','Altas')}${K('43%','Efectividad')}${K('08m','Duración prom.')}</div>`;else content.innerHTML=`<div class="card hero"><b>Resumen del día</b><div class="muted">Cierre operativo del Prospector.</div></div><div class="grid2">${K('07','Visitas')}${K('03','Altas')}</div><button class="btn primary" style="margin-top:12px">Registrar Fin de Jornada</button>`}
function rDev(){
if(s.page==='dh')content.innerHTML=`<div class="card hero"><div class="row"><div><div class="muted">Hola,</div><b style="font-size:20px">Diego 👋</b></div><span class="status ${s.dEnd?'':s.dJ?'':'warn'}">${s.dEnd?'JORNADA CERRADA':s.dJ?'JORNADA ACTIVA':'PENDIENTE'}</span></div><div class="muted" style="margin-top:7px">Rol DESARROLLADOR · clientes, bonos y avance de Prospectores.</div></div><div class="grid2"><button class="menu" data-go="dj"><span>◷</span><strong>Inicio de Jornada</strong><small>Horario de ingreso.</small></button><button class="menu" data-go="dv"><span>⌖</span><strong>Visitas a Clientes</strong><small>Código cliente + bono.</small></button><button class="menu" data-go="da"><span>▥</span><strong>Avance Prospectores</strong><small>KPIs del Supervisor.</small></button><button class="menu" data-go="df"><span>⇥</span><strong>Fin de Jornada</strong><small>Cierre del Desarrollador.</small></button></div><div class="section">Resumen de hoy</div><div class="grid2">${K('06','Clientes visitados')}${K('04','Bonos entregados')}${K('03','Efectivo')}${K('01','Notas crédito')}</div>`;
else if(s.page==='dj')content.innerHTML=s.dJ?`<div class="alert ok"><b>Jornada de Desarrollador registrada</b><br>Ingreso Anticipado · 07:58</div><div class="card" style="margin-top:11px"><b>Base independiente</b><div class="muted">BBDD_INICIO_JORNADA_DESARROLLADOR</div></div>`:`<div class="card"><b>Inicio de Jornada · Desarrollador</b><div class="muted" style="margin-top:5px">Se guarda separado de Prospectores.</div><button id="dStart" class="btn primary" style="margin-top:14px">Registrar Inicio</button></div>`;
else if(s.page==='dv'){
 if(!s.dJ)content.innerHTML=`<div class="alert warnbox"><b>Antes de visitar clientes</b><br>Registra tu inicio de jornada como Desarrollador.</div><button id="goDJ" class="btn primary" style="margin-top:12px">Ir a Jornada</button>`;
 else if(s.dEnd)content.innerHTML=`<div class="alert warnbox"><b>Jornada cerrada</b><br>Ya registraste el Fin de Jornada. No puedes iniciar nuevas visitas hoy.</div>`;
 else if(!s.dVisit)content.innerHTML=`<div class="card"><b>Nueva visita</b><div class="muted" style="margin-top:5px">Al iniciar se registra hora + GPS.</div><button id="dVisit" class="btn primary" style="margin-top:13px">Iniciar Visita</button></div><div class="section">Visitas de hoy</div><div class="card">${P('C','Cliente 10024578','09:10 · Bono: SI','Efectivo')}${P('C','Cliente 10027891','10:03 · Bono: SI','Nota crédito')}${P('C','Cliente 10029901','11:25 · Bono: NO','')}</div>`;
 else content.innerHTML=`<div class="card"><div class="row"><div><b>Visita en curso</b><div class="muted">GPS_OK · 09:10</div></div><span class="status">GPS VÁLIDO</span></div></div><div class="card"><label class="label">Código de cliente *</label><input id="client" class="field" value="10024578"><label class="label">¿Se entregó bono? *</label><select id="bonus" class="field"><option value="">Selecciona</option><option>SI</option><option>NO</option></select><div id="bonusArea"></div></div><button id="finishD" class="btn green">Finalizar Visita</button>`;
}
else if(s.page==='da')content.innerHTML=`<div class="card hero"><div class="muted">Avance total</div><b style="font-size:20px">Prospectores</b><div class="muted">Mismos indicadores del Supervisor · consolidado nacional.</div></div><div class="grid2">${K('20','Prospectores')}${K('90%','Asistencia')}${K('126','Visitas')}${K('41','Altas')}</div><div class="card" style="margin-top:10px">${K('32.5%','Conversión')}</div><div class="section">Avance por prospector</div><div class="card">${P('VQ','Valeria Quispe','08:04 · 12 visitas · 5 altas','42%')}${P('JP','José Paredes','07:51 · 15 visitas · 7 altas','47%')}${P('CS','Camila Soto','08:23 · 9 visitas · 2 altas','22%')}</div>`;
else content.innerHTML=s.dEnd?`<div class="alert ok"><b>Fin de Jornada registrado</b><br>Salida 17:12 · 9 h 14 min</div><div class="card" style="margin-top:11px"><b>Base independiente</b><div class="muted">BBDD_FIN_JORNADA_DESARROLLADOR</div></div>`:`<div class="card hero"><b>Fin de Jornada · Desarrollador</b><div class="muted">Cierra el día una vez terminadas todas las visitas.</div></div><div class="grid2">${K('07:58','Inicio')}${K('06','Visitas')}${K('04','Bonos')}${K('Listo','Estado')}</div><button id="dEnd" class="btn primary" style="margin-top:12px" ${!s.dJ||s.dVisit?'disabled':''}>Registrar Fin de Jornada</button>`;
}
function rSup(){if(s.page==='sd')content.innerHTML=`<div class="card hero"><div class="muted">Hola,</div><b style="font-size:20px">Claudia 👋</b><div class="muted">Seguimiento regional</div></div><div class="grid2">${K('18/20','Asistencia')}${K('126','Visitas')}${K('41','Altas')}${K('32.5%','Efectividad')}</div>`;else if(s.page==='se')content.innerHTML=`<div class="card">${P('FR','Fiorella Natali','Arequipa · ACTIVO','9 visitas')}${P('LA','Luis Angel','Arequipa · ACTIVO','8 visitas')}${P('JM','Jesús Martín','Arequipa · ACTIVO','7 visitas')}</div>`;else if(s.page==='sa')content.innerHTML=`<div class="card">${P('FR','Fiorella Natali','07:56','Anticipado')}${P('LA','Luis Angel','08:07','Puntual')}${P('JM','Jesús Martín','08:18','Tardío')}</div>`;else content.innerHTML=`<div class="grid2">${K('126','Visitas')}${K('41','Exitosas')}</div><div class="card" style="margin-top:11px">${P('FR','Fiorella Natali','10:42 · Bodega · GPS válido','EXITOSA')}${P('LA','Luis Angel','10:18 · Cliente cerrado','NO')}</div>`}
function rAdmin(){if(s.page==='ad')content.innerHTML=`<div class="card hero"><div class="muted">Hola,</div><b style="font-size:20px">Pilar 👋</b><div class="muted">Administrador · Nacional</div></div><div class="grid2">${K('75','Usuarios')}${K('70','Activos')}${K('486','Visitas Prospector')}${K('64','Visitas Desarrollador')}</div><div class="section">Administración</div><button class="menu" data-go="au" style="width:100%;min-height:75px"><strong>Gestión de Usuarios</strong><small>Incluye Rol Desarrollador</small></button><button class="menu" data-go="ab" style="width:100%;min-height:75px;margin-top:8px"><strong>Bases de Datos</strong><small>3 Prospector + 3 Desarrollador</small></button>`;else if(s.page==='au')content.innerHTML=`<div class="grid2"><button class="btn primary">+ Nuevo usuario</button><button class="btn secondary">Importar Excel</button></div><div class="card" style="margin-top:11px">${P('PE','Pilar Escobal','Administrador · Lima','ACTIVO')}${P('DV','Diego Vega','Desarrollador · Lima','ACTIVO')}${P('FR','Fiorella Natali','Prospector · Sur','ACTIVO')}${P('CA','Claudia','Supervisor · Lima','ACTIVO')}</div><div class="alert ok">El selector de Rol ya incluye: Prospector, Desarrollador, Supervisor y Administrador.</div>`;else if(s.page==='ab')renderDb();else content.innerHTML=`<div class="card"><b>Supabase</b><div class="divider"></div><div class="row"><span>Authentication</span><span class="status">ACTIVO</span></div><div class="divider"></div><div class="row"><span>PostgreSQL + RLS</span><span class="status">ACTIVO</span></div><div class="divider"></div><div class="row"><span>Storage privado</span><span class="status">ACTIVO</span></div></div>`}
function renderDb(){
const tabs=[['inicio','Inicio P.'],['visitas','Visitas P.'],['fin','Fin P.'],['devInicio','Inicio Dev.'],['devVisitas','Visitas Dev.'],['devFin','Fin Dev.']];
const rows=db[s.db];
let heads=s.db==='devVisitas'?['Fecha','Desarrollador','Cliente','Bono','Tipo','Foto','Nota','Comentario NO']:
s.db==='devFin'?['Fecha','Desarrollador','Inicio','Fin','Duración']:
s.db==='devInicio'?['Fecha','Desarrollador','Hora','Clasificación']:
s.db==='visitas'?['Fecha','Usuario','Hora','Exitosa','Subcanal']:
s.db==='fin'?['Fecha','Usuario','Salida','Visitas']:['Fecha','Usuario','Hora','Clasificación'];
const title=s.db==='devVisitas'?'BBDD_VISITAS_DESARROLLADOR':
s.db==='devInicio'?'BBDD_INICIO_JORNADA_DESARROLLADOR':
s.db==='devFin'?'BBDD_FIN_JORNADA_DESARROLLADOR':
s.db==='inicio'?'BBDD_INICIO_JORNADA':
s.db==='visitas'?'BBDD_VISITAS':'BBDD_FIN_JORNADA';
content.innerHTML=`<div class="tabs">${tabs.map(t=>`<button data-db="${t[0]}" class="${s.db===t[0]?'active':''}">${t[1]}</button>`).join('')}</div><div class="row" style="margin:14px 0 8px"><div><b>${title}</b><div class="muted">${rows.length} registros demo</div></div><button class="btn primary" style="width:auto;font-size:10px">Exportar Excel</button></div><div class="tableWrap"><table class="table"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div><button class="btn secondary" style="margin-top:11px">Exportar las 6 bases</button>`
}
function bind(){
$$('[data-go]',content).forEach(b=>b.onclick=()=>{s.page=b.dataset.go;render()});
const ps=$('#pStart');if(ps)ps.onclick=()=>{s.pJ=true;render();show('Inicio Prospector registrado')};
const ds=$('#dStart');if(ds)ds.onclick=()=>{s.dJ=true;render();show('Inicio Desarrollador registrado')};
const de=$('#dEnd');if(de)de.onclick=()=>{if(!s.dJ)return show('Primero registra tu inicio');if(s.dVisit)return show('Finaliza la visita en curso');s.dEnd=true;render();show('Fin de Jornada Desarrollador registrado')};
const gp=$('#goPJ');if(gp)gp.onclick=()=>{s.page='pj';render()};
const gd=$('#goDJ');if(gd)gd.onclick=()=>{s.page='dj';render()};
const dv=$('#dVisit');if(dv)dv.onclick=()=>{if(s.dEnd)return show('La jornada ya fue cerrada');s.dVisit=true;render();show('Visita iniciada · GPS demo')};
const bonus=$('#bonus');
if(bonus)bonus.onchange=()=>{
 s.bonus=bonus.value;const a=$('#bonusArea');
 a.innerHTML=bonus.value==='SI'?`<label class="label">Tipo de bono *</label><select id="bonusType" class="field"><option value="">Selecciona</option><option value="cash">Dinero efectivo</option><option value="note">Nota de crédito</option></select><div id="evidence"></div>`:bonus.value==='NO'?`<label class="label">¿Por qué no se entregó el bono? *</label><textarea id="noBonusComment" class="field" style="min-height:90px;resize:none" placeholder="Escribe el motivo…"></textarea>`:'';
 const bt=$('#bonusType');if(bt)bt.onchange=()=>{$('#evidence').innerHTML=bt.value==='cash'?`<label class="label">Foto de entrega de dinero *</label><label class="photo">📷 Adjuntar foto<input type="file" accept="image/*" style="display:none"></label>`:bt.value==='note'?`<label class="label">Código de nota de crédito *</label><input class="field" value="NC-2026-001245">`:''}
};
const fd=$('#finishD');if(fd)fd.onclick=()=>{const client=$('#client')?.value?.trim();const b=$('#bonus')?.value;if(!client)return show('Ingresa el código de cliente');if(!b)return show('Indica si se entregó bono');if(b==='NO'&&!$('#noBonusComment')?.value?.trim())return show('Escribe por qué no se entregó el bono');s.dVisit=false;s.bonus='';render();show('Visita Desarrollador guardada')};
$$('[data-db]',content).forEach(b=>b.onclick=()=>{s.db=b.dataset.db;render()})
}
})();
</script></body></html>
